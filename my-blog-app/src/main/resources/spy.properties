# 仅 dev 数据源使用 P6SpyDriver 时生效。
modulelist=com.p6spy.engine.logging.P6LogFactory
# 接入现有 SLF4J/Logback 日志体系，输出参数展开后的 SQL 与耗时。
appender=com.p6spy.engine.spy.appender.Slf4JLogger
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=[SQL] %(executionTime) ms | %(sqlSingleLine)
# 不打印结果集和事务边界，保留 statement、batch 和错误日志。
excludecategories=info,debug,result,resultset,commit,rollback
